# Lanza OpenCode desde los comentarios de GitHub.
# Escribe un comentario con "/oc" (o "/opencode") y el agente se ejecuta.
#
# Corre en el runner auto-hospedado de esta misma máquina para poder usar
# LiteLLM (127.0.0.1:4000) y, con él, LM Studio y CliGate. Desde un runner
# hospedado de GitHub no se llegarían a 127.0.0.1.
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Solo el dueño del repo puede lanzar al agente (el job tiene permisos
    # de escritura y además corre en tu propia máquina).
    if: >-
      github.event.comment.user.login == 'sergioromerocarrizosa' &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: [self-hosted]
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Preflight: sin secret o sin LiteLLM en marcha, se avisa en el
      # resumen del run en vez de dejar un fallo incomprensible.
      - name: Preflight (secret + LiteLLM)
        id: pre
        shell: bash
        env:
          API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            {
              echo "### ⚠️ OpenCode no se ha ejecutado"
              echo "Falta el secret \`LITELLM_API_KEY\` (Settings → Secrets and variables → Actions)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "listo=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 \
            http://127.0.0.1:4000/health/liveliness || echo 000)
          if [ "$code" = "000" ]; then
            {
              echo "### ⚠️ LiteLLM no responde en 127.0.0.1:4000"
              echo "¿Está Docker (contenedor de LiteLLM) y LM Studio en marcha?"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "listo=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "listo=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.pre.outputs.listo == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        if: steps.pre.outputs.listo == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          # Key de LiteLLM (master key). El proveedor «litellm-ci» está
          # definido en opencode.jsonc de la raíz del repo.
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: litellm-ci/qwen3.8-27b
          # Usa el GITHUB_TOKEN del propio workflow: no hace falta instalar
          # la GitHub App «opencode-agent» ni dar permiso id-token: write.
          use_github_token: true
